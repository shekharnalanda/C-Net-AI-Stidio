---
deployment:
  tasks:
    - export DEPLOYPATH=/home4/mcied45x/studio.mciedu.com
    - /bin/rsync -a --delete --exclude='.git' --exclude='.env' ./ $DEPLOYPATH/
    - cd $DEPLOYPATH && composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
    - /bin/rsync -a --exclude='index.php' $DEPLOYPATH/public/ $DEPLOYPATH/
    - printf '%s\n' '<?php' '' 'use Illuminate\Foundation\Application;' 'use Illuminate\Http\Request;' '' 'define('\''LARAVEL_START'\'', microtime(true));' '' 'if (file_exists($maintenance = __DIR__.'\''/storage/framework/maintenance.php'\'')) {' '    require $maintenance;' '}' '' 'require __DIR__.'\''/vendor/autoload.php'\'';' '' '/** @var Application $app */' '$app = require_once __DIR__.'\''/bootstrap/app.php'\'';' '' '$app->handleRequest(Request::capture());' > $DEPLOYPATH/index.php
    - cd $DEPLOYPATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan optimize:clear
    - cd $DEPLOYPATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan config:cache
    - cd $DEPLOYPATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan route:cache
    - cd $DEPLOYPATH && /opt/cpanel/ea-php83/root/usr/bin/php artisan view:cache
