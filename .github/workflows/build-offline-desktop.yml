name: Build Offline Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/build-offline-desktop.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm test
        env:
          CNET_RUNTIME_INTEGRATION: '1'
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: C-Net-AI-Studio-Offline-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
