name: Build Offline Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/build-offline-desktop.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          CNET_RUNTIME_INTEGRATION: '1'
      - run: npm run dist:win
      - name: Create installer SHA-256 manifest
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash *$($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: C-Net-AI-Studio-Offline-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.sha256
          if-no-files-found: error
      - name: Publish versioned GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $assets = @(Get-ChildItem dist/*.exe,dist/*.sha256 | ForEach-Object { $_.FullName })
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "C-Net AI Studio Universal Offline $version" --notes-file ../RELEASE_NOTES.md
          }
