name: Build Offline Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/build-offline-desktop.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          CNET_RUNTIME_INTEGRATION: '1'
      - run: npm run dist:win
      - name: Create installer SHA-256 manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash *$($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: C-Net-AI-Studio-Offline-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.sha256
          if-no-files-found: error
