<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C-Net AI Studio</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><div><p class="eyebrow">OFFLINE DESKTOP V9</p><h1>C-Net AI Studio</h1><p>Universal AI Engine & Model Manager</p></div><span id="status">Scanning system…</span></header>
<section class="flow"><div class="active">1. System Scan</div><div>2. Select Tool</div><div>3. Choose Engine</div><div>4. Generate</div></section>
<section class="grid"><article><h2>System profile</h2><div id="hardware"></div><button id="rescan">Scan again</button></article><article><h2>Selection mode</h2><label><input type="radio" name="mode" value="auto" checked> Auto — Recommended</label><label><input type="radio" name="mode" value="suggested"> Suggested options</label><label><input type="radio" name="mode" value="manual"> Manual selection</label></article><article><h2>Project workspace</h2><div class="actions"><select id="project"></select><button id="new-project">New project</button></div><div id="history"></div></article></section>
<section><h2>AI tool</h2><div id="tools" class="tools"></div></section><section><h2>AI Engine & Model Manager</h2><p id="notice" class="notice"></p><div id="engines" class="engines"></div></section><section class="workbench"><h2>Generation Workbench</h2><textarea id="prompt" rows="5" placeholder="Describe what you want to create..."></textarea><div id="image-controls" class="image-controls"><input id="negative-prompt" placeholder="Negative prompt (optional)"><label>Size <select id="image-size"><option value="512x512">512 × 512</option><option value="768x512">768 × 512</option><option value="512x768">512 × 768</option></select></label><label>Steps <input id="steps" type="number" min="1" max="50" value="20"></label><label>Seed <input id="seed" type="number" min="-1" value="-1"></label></div><div id="video-controls" class="video-controls"><button id="video-images">Select images</button><span id="video-images-name">No images selected</span><button id="video-audio">Soundtrack</button><button id="video-subtitle">Subtitles</button><label>Seconds/image <input id="slide-seconds" type="number" min="1" max="30" value="3"></label><label>Format <select id="video-size"><option value="1280x720">HD 16:9</option><option value="1080x1080">Square</option><option value="1080x1920">Vertical</option><option value="1920x1080">Full HD</option></select></label></div><div class="actions"><button id="media">Select audio/video</button><span id="media-name"></span><select id="language"><option value="auto">Auto language</option><option value="hi">Hindi</option><option value="en">English</option></select><button id="generate">Generate offline</button><button id="save-subtitle" disabled>Save edited subtitle</button></div><textarea id="result" rows="10" aria-label="Generation result">Select a ready engine to begin.</textarea><div id="gallery" class="gallery"></div></section></main><script type="module" src="renderer.js"></script></body></html>
