<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C-Net AI Studio</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><div><p class="eyebrow">OFFLINE DESKTOP V1</p><h1>C-Net AI Studio</h1><p>Universal AI Engine & Model Manager</p></div><span id="status">Scanning system…</span></header>
<section class="flow"><div class="active">1. System Scan</div><div>2. Select Tool</div><div>3. Choose Engine</div><div>4. Generate</div></section>
<section class="grid"><article><h2>System profile</h2><div id="hardware"></div><button id="rescan">Scan again</button></article><article><h2>Selection mode</h2><label><input type="radio" name="mode" value="auto" checked> Auto — Recommended</label><label><input type="radio" name="mode" value="suggested"> Suggested options</label><label><input type="radio" name="mode" value="manual"> Manual selection</label></article></section>
<section><h2>AI tool</h2><div id="tools" class="tools"></div></section><section><h2>AI Engine & Model Manager</h2><p id="notice" class="notice"></p><div id="engines" class="engines"></div></section><section class="workbench"><h2>Generation Workbench</h2><textarea id="prompt" rows="5" placeholder="Describe what you want to create..."></textarea><div class="actions"><button id="media">Select audio/video</button><span id="media-name"></span><select id="language"><option value="auto">Auto language</option><option value="hi">Hindi</option><option value="en">English</option></select><button id="generate">Generate offline</button><button id="save-subtitle" disabled>Save edited subtitle</button></div><textarea id="result" rows="10" aria-label="Generation result">Select a ready engine to begin.</textarea></section></main><script type="module" src="renderer.js"></script></body></html>
